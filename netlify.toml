# Netlify runs everything:
# - static site + feeds: `site/`, generated by `npm run build:site` from the live API
# - API: one Function on /v1/* and /healthz (netlify/functions/api.mts)
# - worker: scheduled Function, every minute, published deploys only (netlify/functions/worker.mts)
# - Postgres: Netlify Database; netlify/database/migrations is applied before each production deploy publishes
# Settings and secrets are Netlify environment variables; docs/DEPLOY.md lists them with their scopes.
# The worker rebuilds the site through a build hook (NETLIFY_BUILD_HOOK_URL) after each publish or retraction.

[build]
  command = "npm run build:site"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/events.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/atom.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
